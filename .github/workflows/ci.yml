name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LITESTAR_APP: app.main:app
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Cache uv downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .uv-cache
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Evaluate flake
        run: nix flake check --all-systems --no-build

      - name: Install locked dependencies
        run: nix develop --command uv sync --all-groups --frozen

      - name: Check formatting
        run: nix develop --command uv run ruff format --check .

      - name: Lint
        run: nix develop --command uv run ruff check .

      - name: Type check
        run: nix develop --command uv run basedpyright

      - name: Check import contracts
        run: nix develop --command uv run lint-imports

      - name: Run architecture and unit tests
        run: nix develop --command uv run pytest tests/architecture tests/unit

      - name: Run prek hook stages
        run: |
          nix develop --command uv run prek run --all-files --hook-stage pre-commit
          nix develop --command uv run prek run --all-files --hook-stage pre-push

  integration:
    name: Linux integration
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      APP_ENV: test
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://app_user:app_dev_password@127.0.0.1:5432/lsstack
      ADMIN_DATABASE_URL: postgresql+psycopg://postgres:postgres_dev_password@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgresql+psycopg://app_user:app_dev_password@127.0.0.1:5432/lsstack_test
      SAQ_DATABASE_URL: postgresql://saq_user:saq_dev_password@127.0.0.1:5432/lsstack
      RUN_DATABASE_TESTS: "1"
      RUN_SERVICE_TESTS: "1"
      SESSION_SECRET: ci-session-secret-with-at-least-thirty-two-bytes
      CSRF_SECRET: ci-csrf-secret-with-at-least-thirty-two-bytes
      SESSION_COOKIE_SECURE: "false"
      TELEMETRY_ENABLED: "true"
      OTLP_ENDPOINT: http://127.0.0.1:4317
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Cache uv downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .uv-cache
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Install locked dependencies
        run: nix develop --command uv sync --all-groups --frozen

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Start local dependencies
        run: docker compose up -d --wait

      - name: Upgrade application schema
        run: nix develop --command uv run alembic upgrade head

      - name: Start host application and worker
        run: |
          mkdir -p .ci
          nix develop --command uv run litestar run --host 0.0.0.0 --port 8000 >.ci/app.log 2>&1 &
          echo "$!" >.ci/app.pid
          nix develop --command uv run litestar workers run >.ci/worker.log 2>&1 &
          echo "$!" >.ci/worker.pid

      - name: Wait for application through Nginx
        run: |
          for attempt in $(seq 1 60); do
            echo "Readiness attempt ${attempt}/60"
            if curl --fail --silent --show-error http://127.0.0.1:8080/readyz >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat .ci/app.pid)" 2>/dev/null; then
              cat .ci/app.log
              exit 1
            fi
            sleep 1
          done
          echo "Application did not become ready through Nginx" >&2
          exit 1

      - name: Run integration, performance, and service smoke tests
        run: >-
          nix develop --command uv run pytest
          tests/integration
          tests/performance

      - name: Verify local observability ingestion
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/livez >/dev/null
          seen_app_log=0
          seen_worker_log=0
          seen_nginx_log=0
          seen_metric=0
          seen_trace=0
          for attempt in $(seq 1 120); do
            app_logs=$(docker compose exec -T lgtm curl --fail --silent --get \
              --data-urlencode 'query={service_name="lsstack"}' \
              --data-urlencode 'limit=1' \
              http://127.0.0.1:3100/loki/api/v1/query_range)
            worker_logs=$(docker compose exec -T lgtm curl --fail --silent --get \
              --data-urlencode 'query={service_name="lsstack"} |= "outbox_message_acknowledged"' \
              --data-urlencode 'limit=1' \
              http://127.0.0.1:3100/loki/api/v1/query_range)
            nginx_logs=$(docker compose exec -T lgtm curl --fail --silent --get \
              --data-urlencode 'query={service_name="nginx"}' \
              --data-urlencode 'limit=1' \
              http://127.0.0.1:3100/loki/api/v1/query_range)
            metrics=$(docker compose exec -T lgtm curl --fail --silent --get \
              --data-urlencode 'query=event_loop_lag_seconds' \
              http://127.0.0.1:9090/api/v1/query)
            traces=$(docker compose exec -T lgtm curl --fail --silent --get \
              --data-urlencode 'q={ resource.service.name = "lsstack" }' \
              --data-urlencode 'limit=1' \
              http://127.0.0.1:3200/api/search)
            case "${app_logs}" in *'"result":[]'*) ;; *) seen_app_log=1 ;; esac
            case "${worker_logs}" in *'"result":[]'*) ;; *) seen_worker_log=1 ;; esac
            case "${nginx_logs}" in *'"result":[]'*) ;; *) seen_nginx_log=1 ;; esac
            case "${metrics}" in *'"result":[]'*) ;; *) seen_metric=1 ;; esac
            case "${traces}" in *'"traces":[]'*) ;; *) seen_trace=1 ;; esac
            if test "${seen_app_log}${seen_worker_log}${seen_nginx_log}${seen_metric}${seen_trace}" = "11111"; then
              exit 0
            fi
            echo "Ingestion attempt ${attempt}/120: app_log=${seen_app_log} worker_log=${seen_worker_log} nginx_log=${seen_nginx_log} metric=${seen_metric} trace=${seen_trace}"
            sleep 1
          done
          echo "Required local telemetry did not arrive before the bounded deadline" >&2
          exit 1

      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p .ci
          docker compose ps --all >.ci/compose-ps.log
          docker compose logs --no-color >.ci/compose.log 2>&1

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-diagnostics
          path: .ci/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop host processes and Compose
        if: always()
        run: |
          if test -f .ci/worker.pid; then
            kill "$(cat .ci/worker.pid)" 2>/dev/null || true
          fi
          if test -f .ci/app.pid; then
            kill "$(cat .ci/app.pid)" 2>/dev/null || true
          fi
          docker compose down --remove-orphans
