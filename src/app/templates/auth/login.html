{% extends "base.html" %}
{% block title %}Log in · lsstack{% endblock %}
{% block content %}
  <article>
    <header><h1>Log in</h1></header>
    {% if errors %}
      <div class="validation-summary" role="alert" tabindex="-1">
        <h2>There was a problem</h2>
        <ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
      </div>
    {% endif %}
    <form action="/login" method="post">
      {{ csrf_input | safe }}
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" required
             maxlength="320" value="{{ values.email | default('') }}">
      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required minlength="12" maxlength="128">
      <button type="submit">Log in</button>
    </form>
    <footer>Need an account? <a href="/register">Register</a>.</footer>
  </article>
{% endblock %}
