{% extends "base.html" %}
{% block title %}Edit task · lsstack{% endblock %}
{% block content %}
  <h1>Edit task</h1>
  {% if errors %}
    <div class="validation-summary" role="alert" tabindex="-1">
      <h2>Please correct the following</h2>
      <ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
    </div>
  {% endif %}
  <form action="/tasks/{{ task.public_id }}/edit" method="post">
    {{ csrf_input | safe }}
    <label for="title">Title</label>
    <input id="title" name="title" required maxlength="200"
           value="{{ values.title | default(task.title) }}">
    <label for="description">Description <small>(optional)</small></label>
    <textarea id="description" name="description" maxlength="5000"
              rows="6">{{ values.description | default(task.description or '') }}</textarea>
    <button type="submit">Save changes</button>
    <a role="button" class="secondary outline" href="/tasks">Cancel</a>
  </form>
{% endblock %}
