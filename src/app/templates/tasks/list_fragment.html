{% if errors %}
  <div class="validation-summary" role="alert" tabindex="-1">
    <h3>Please correct the following</h3>
    <ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
  </div>
{% endif %}
{% if tasks %}
  {% for task in tasks %}
    {% include "tasks/row.html" %}
  {% endfor %}
{% else %}
  <article class="empty-state" id="task-empty-state">
    <h3>No tasks yet</h3>
    <p>Add your first task using the form above.</p>
  </article>
{% endif %}
