default_install_hook_types:
  - pre-commit
  - pre-push
default_stages:
  - pre-commit
  - pre-push
fail_fast: true
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check --fix
        language: system
        types_or:
          - python
          - pyi
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types_or:
          - python
          - pyi
      - id: basedpyright
        name: basedpyright strict
        entry: uv run basedpyright
        language: system
        pass_filenames: false
        stages:
          - pre-push
      - id: import-linter
        name: Import Linter contracts
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        stages:
          - pre-push
      - id: architecture-tests
        name: Architecture tests
        entry: uv run pytest tests/architecture
        language: system
        pass_filenames: false
        stages:
          - pre-push
