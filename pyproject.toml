[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lsstack"
version = "0.1.0"
description = "A local-first starter for server-rendered Litestar applications"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.16.5,<2",
    "anyio>=4.10,<5",
    "jinja2>=3.1.6,<4",
    "litestar[cryptography,jinja,standard]>=2.17,<3",
    "litestar-saq>=0.8,<0.9",
    "opentelemetry-api>=1.36,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.36,<2",
    "opentelemetry-instrumentation-asgi>=0.57b0,<0.58",
    "opentelemetry-instrumentation-logging>=0.57b0,<0.58",
    "opentelemetry-instrumentation-sqlalchemy>=0.57b0,<0.58",
    "opentelemetry-sdk>=1.36,<2",
    "psycopg[binary,pool]>=3.2.9,<4",
    "pwdlib[argon2]>=0.2.1,<0.3",
    "pydantic[email]>=2.11.7,<3",
    "pydantic-settings>=2.10.1,<3",
    "python-multipart>=0.0.20,<0.1",
    "saq[postgres]>=0.26.4",
    "sqids>=0.5.2,<0.6",
    "sqlalchemy[asyncio]>=2.0.51,<3",
    "structlog>=25.4,<26",
]

[dependency-groups]
quality = [
    "basedpyright>=1.31.4,<2",
    "import-linter>=2.4,<3",
    "prek>=0.2.1,<0.3",
    "ruff>=0.12.10,<0.13",
]
test = [
    "httpx>=0.28.1,<0.29",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2.1,<7",
    "time-machine>=2.17,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests", "migrations"]

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E",
    "F",
    "FA",
    "FBT",
    "FLY",
    "FURB",
    "I",
    "INP",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLOT",
    "T10",
    "TC",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "PLR0913",
    "PLR2004",
    "S101",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["INP001"]
"tests/**/*.py" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.basedpyright]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "strict"
include = ["src", "tests", "migrations"]
exclude = [".venv"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "warning"

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires PostgreSQL or another local service",
    "observability: requires the local LGTM stack",
    "performance: controlled endpoint performance checks",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
